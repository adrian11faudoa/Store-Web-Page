<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — tiny.fits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    .shop-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      min-height: 60vh;
    }

    /* Sidebar */
    .sidebar {
      padding: 2rem 1.5rem;
      border-right: 1px solid var(--color-border);
      background: var(--color-surface);
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-text-muted);
      margin-bottom: 0.75rem;
      margin-top: 1.5rem;
    }
    .sidebar h3:first-child { margin-top: 0; }

    .sidebar-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--transition);
      width: 100%;
      background: none;
      border: none;
      text-align: left;
    }
    .sidebar-option:hover { background: var(--color-surface-2); color: var(--color-text); }
    .sidebar-option.active { background: var(--color-brand-light); color: var(--color-brand); }
    .sidebar-option .count {
      margin-left: auto;
      font-size: 11px;
      background: var(--color-surface-2);
      border-radius: var(--radius-pill);
      padding: 1px 7px;
      color: var(--color-text-faint);
    }
    .sidebar-option.active .count { background: var(--color-brand-mid); color: var(--color-brand-dark); }

    /* Price range */
    .price-range {
      padding: 4px 2px;
    }
    .price-range input[type=range] {
      width: 100%;
      accent-color: var(--color-brand);
      margin: 8px 0;
    }
    .price-range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
    }

    /* Main content */
    .shop-main { padding: 1.5rem 2rem; background: var(--color-bg); }

    .shop-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1px solid var(--color-border-md);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .search-box input:focus {
      border-color: var(--color-brand-mid);
      box-shadow: 0 0 0 3px rgba(60,52,137,0.10);
    }
    .search-box__icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
    }
    .search-box__icon svg { width: 15px; height: 15px; }

    .sort-select {
      padding: 9px 14px;
      border: 1px solid var(--color-border-md);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      cursor: pointer;
    }

    .result-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-muted);
    }
    .result-count strong { color: var(--color-text); }

    /* No results */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
    }
    .empty-state__emoji { font-size: 48px; margin-bottom: 1rem; }
    .empty-state h3 { font-family: var(--font-display); font-size: 22px; margin-bottom: 8px; }
    .empty-state p { color: var(--color-text-muted); font-size: 14px; }

    @media (max-width: 768px) {
      .shop-layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--color-border); }
    }
  </style>
</head>
<body>

  <div id="navbar-mount"></div>

  <!-- Category bar -->
  <div id="catbar-mount"></div>

  <div class="shop-layout">

    <!-- ---- SIDEBAR ---- -->
    <aside class="sidebar">

      <h3>Category</h3>
      <div id="sidebar-cats"></div>

      <h3>Age range</h3>
      <div id="sidebar-ages"></div>

      <h3>Price</h3>
      <div class="price-range">
        <input type="range" id="price-slider" min="0" max="60" value="60" step="1" />
        <div class="price-range-labels">
          <span>$0</span>
          <span id="price-label">Up to $60</span>
        </div>
      </div>

      <h3>Availability</h3>
      <button class="sidebar-option active" id="toggle-sale">
        <span>🏷 On sale</span>
        <span class="count" id="sale-count">0</span>
      </button>
      <button class="sidebar-option active" id="toggle-new">
        <span>✨ New in</span>
        <span class="count" id="new-count">0</span>
      </button>

    </aside>

    <!-- ---- MAIN ---- -->
    <main class="shop-main">

      <div class="shop-toolbar">
        <div class="search-box">
          <span class="search-box__icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" id="search-input" placeholder="Search products…" autocomplete="off" />
        </div>
        <span class="result-count" id="result-count"></span>
        <select class="sort-select" id="sort-select">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to high</option>
          <option value="price-desc">Price: High to low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>

      <div id="shop-grid" class="product-grid"></div>

    </main>
  </div>

  <div id="trust-mount"></div>
  <div id="footer-mount"></div>
  <div class="toast" id="toast"></div>

  <!-- Fuse.js for fuzzy search -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>

  <script type="module">
    import PRODUCTS from './js/data.js';
    import {
      renderNavbar, renderProductGrid, renderCategoryTabs,
      renderTrustStrip, renderFooter
    } from './js/components.js';

    // Mount shared components
    document.getElementById('navbar-mount').appendChild(renderNavbar());
    document.getElementById('trust-mount').appendChild(renderTrustStrip());
    document.getElementById('footer-mount').appendChild(renderFooter());

    // --- State ---
    let state = {
      category: 'all',
      age: 'all',
      maxPrice: 60,
      showSale: true,
      showNew: true,
      query: '',
      sort: 'featured',
    };

    // --- Fuse search instance ---
    const fuse = new Fuse(PRODUCTS, {
      keys: ['name', 'ages', 'category'],
      threshold: 0.35,
    });

    // --- Category bar ---
    const CAT_TABS = [
      { label: 'All', value: 'all' },
      { label: 'Tops', value: 'tops' },
      { label: 'Bottoms', value: 'bottoms' },
      { label: 'Girls', value: 'girls' },
      { label: 'Swimwear', value: 'swimwear' },
      { label: 'Footwear', value: 'footwear' },
      { label: 'Accessories', value: 'accessories' },
    ];
    document.getElementById('catbar-mount').appendChild(
      renderCategoryTabs(CAT_TABS, state.category, val => { state.category = val; render(); })
    );

    // --- Sidebar categories ---
    const catCounts = {};
    PRODUCTS.forEach(p => { catCounts[p.category] = (catCounts[p.category] || 0) + 1; });
    const sidebarCats = document.getElementById('sidebar-cats');
    [{ label: 'All items', value: 'all', count: PRODUCTS.length }, ...CAT_TABS.slice(1).map(t => ({
      ...t, count: catCounts[t.value] || 0
    }))].forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-option' + (state.category === c.value ? ' active' : '');
      btn.dataset.val = c.value;
      btn.innerHTML = `<span>${c.label}</span><span class="count">${c.count}</span>`;
      btn.addEventListener('click', () => {
        state.category = c.value;
        sidebarCats.querySelectorAll('.sidebar-option').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      sidebarCats.appendChild(btn);
    });

    // --- Sidebar ages ---
    const AGE_OPTS = [
      { label: 'All ages', value: 'all' },
      { label: 'Baby (0–18m)', value: 'baby' },
      { label: 'Toddler (1–3y)', value: 'toddler' },
      { label: 'Kids (4–8y)', value: 'kids' },
      { label: 'Older kids (9–14y)', value: 'older' },
    ];
    const sidebarAges = document.getElementById('sidebar-ages');
    AGE_OPTS.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-option' + (state.age === a.value ? ' active' : '');
      btn.innerHTML = `<span>${a.label}</span>`;
      btn.addEventListener('click', () => {
        state.age = a.value;
        sidebarAges.querySelectorAll('.sidebar-option').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      sidebarAges.appendChild(btn);
    });

    // --- Price slider ---
    const priceSlider = document.getElementById('price-slider');
    const priceLabel  = document.getElementById('price-label');
    priceSlider.addEventListener('input', () => {
      state.maxPrice = +priceSlider.value;
      priceLabel.textContent = `Up to $${state.maxPrice}`;
      render();
    });

    // --- Sale / New toggles ---
    const saleCount = document.getElementById('sale-count');
    const newCount  = document.getElementById('new-count');
    saleCount.textContent = PRODUCTS.filter(p => p.badge === 'sale').length;
    newCount.textContent  = PRODUCTS.filter(p => p.badge === 'new').length;

    document.getElementById('toggle-sale').addEventListener('click', function() {
      state.showSale = !state.showSale;
      this.classList.toggle('active', state.showSale);
      render();
    });
    document.getElementById('toggle-new').addEventListener('click', function() {
      state.showNew = !state.showNew;
      this.classList.toggle('active', state.showNew);
      render();
    });

    // --- Search ---
    const searchInput = document.getElementById('search-input');
    let searchDebounce;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { state.query = searchInput.value.trim(); render(); }, 200);
    });

    // --- Sort ---
    document.getElementById('sort-select').addEventListener('change', function() {
      state.sort = this.value;
      render();
    });

    // --- Filter & sort logic ---
    function getFiltered() {
      let results = state.query
        ? fuse.search(state.query).map(r => r.item)
        : [...PRODUCTS];

      if (state.category !== 'all') results = results.filter(p => p.category === state.category);
      results = results.filter(p => p.price <= state.maxPrice);
      if (!state.showSale) results = results.filter(p => p.badge !== 'sale');
      if (!state.showNew)  results = results.filter(p => p.badge !== 'new');

      switch (state.sort) {
        case 'price-asc':  results.sort((a,b) => a.price - b.price); break;
        case 'price-desc': results.sort((a,b) => b.price - a.price); break;
        case 'name':       results.sort((a,b) => a.name.localeCompare(b.name)); break;
      }

      return results;
    }

    // --- Render ---
    const grid = document.getElementById('shop-grid');
    const resultCount = document.getElementById('result-count');

    function render() {
      const filtered = getFiltered();
      resultCount.innerHTML = `<strong>${filtered.length}</strong> items`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__emoji">🔍</div>
            <h3>No results found</h3>
            <p>Try adjusting your filters or search term.</p>
          </div>`;
        return;
      }

      renderProductGrid(filtered, grid);
    }

    // --- URL param for pre-filter ---
    const params = new URLSearchParams(location.search);
    if (params.get('filter') === 'sale') state.showNew = false;
    if (params.get('cat')) state.category = params.get('cat');

    render();
  </script>
</body>
</html>
