name: ci-cd

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: store_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d store_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_ci?schema=public
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      APP_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:4000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @store/backend

      - name: Apply migrations
        run: npm run prisma:deploy --workspace @store/backend

      - name: Seed data
        run: npm run prisma:seed --workspace @store/backend

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile .
      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs:
      - quality
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment targets
        run: |
          echo "Connect Vercel to apps/frontend."
          echo "Connect Render/Railway/AWS to apps/backend."
          echo "Apply Prisma migrations during backend release."
