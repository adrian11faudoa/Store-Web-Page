name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm run lint --if-present --prefix client
      - run: npm run lint --if-present --prefix server
      - run: npm test --prefix server --if-present
      - run: npm run build --prefix client

  deploy-placeholder:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - run: echo "Wire this job to Vercel, Render, or AWS deployment secrets."
