services:
  postgres:
    image: postgres:16-alpine
    container_name: store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store_dev?schema=public
      ACCESS_TOKEN_SECRET: local-access-token-secret-change-me
      REFRESH_TOKEN_SECRET: local-refresh-token-secret-change-me
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
      SENTRY_DSN: ""
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_APP_NAME: Store Platform
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
